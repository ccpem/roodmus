[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "pytest",
    "black==26.3.1",
    "flake8==7.3.0",
    "mypy==1.20.0",
    "types-tabulate"
]

docs = [
    "sphinx",
    "sphinx-rtd-theme>=1.2.0"
]

gpu = [
    "guanaco==0.3.3",
    "python-multem==0.4.0",
    "python-parakeet==0.6.5",
]

[project.scripts]
roodmus = "roodmus.cli:main"

[project.urls]
"Homepage" = "https://github.com/ccpem/roodmus"
"Bug Tracker" = "https://github.com/ccpem/roodmus/issues"

