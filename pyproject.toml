[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roodmus"
version = "0.0.42"
authors = [
  { name="Joel Greer", email="joel.greer@stfc.ac.uk" },
  { name="Maarten Joosten", email="m.j.joosten@tudelft.nl" },
]
description = "Synthetic SP micrograph creation and analysis"
readme = "README.md"
requires-python = ">= 3.10"
license = {file = "LICENSE"}
keywords = ["parakeet", "cryo-em", "micrographs", "analysis", "roodmus", "single-particle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "appdirs==1.4.4",
    "astunparse==1.6.3",
    "beautifulsoup4==4.11.2",
    "bs4==0.0.1",
    "ccpem-utils==0.0.1.dev8",
    "cfgv==3.3.1",
    "charset-normalizer==3.0.1",
    "click==8.1.3",
    "cloudpickle==2.2.1",
    "cssselect==1.2.0",
    "cycler==0.11.0",
    "dask==2023.1.1",
    "dask-jobqueue==0.8.1",
    "distlib==0.3.6",
    "distributed==2023.1.1",
    "fake-useragent==1.1.1",
    "filelock==3.9.0",
    "fonttools==4.38.0",
    "fsspec==2023.1.0",
    "gemmi==0.5.4",
    "glob2==0.7",
    "h5py==3.8.0",
    "HeapDict==1.0.1",
    "identify==2.5.19",
    "idna==3.4",
    "imageio==2.25.0",
    "importlib-metadata==6.0.0",
    "Jinja2==3.1.2",
    "joblib==1.2.0",
    "jupyterlab-server",
    "kiwisolver==1.4.4",
    "locket==1.0.0",
    "maptools==0.3.5",
    "MarkupSafe==2.1.2",
    "matplotlib==3.5.2",
    "MDAnalysis",
    "mdtraj",
    "mrcfile==1.5.4",
    "msgpack==1.0.4",
    "networkx==3.0",
    "nodeenv==1.7.0",
    "numpy<2.0.0",
    "packaging==23.0",
    "pandas",
    "pandas-stubs",
    "parse==1.19.0",
    "partd==1.3.0",
    "Pillow",
    "platformdirs==3.1.0",
    "profet==0.0.1",
    "psutil==5.9.4",
    "pydantic",
    "pyee==8.2.2",
    "pyparsing==3.0.9",
    "pypdb==2.2",
    "pyppeteer==1.0.2",
    "pyquery==2.0.0",
    "python-dateutil==2.8.2",
    "PyWavelets",
    "PyYAML",
    "requests",
    "requests-html",
    "scikit-image",
    "scikit-learn>=1.3.4",
    "scipy",
    "seaborn==0.12.2",
    "setuptools==80.0",
    "six==1.16.0",
    "sortedcontainers==2.4.0",
    "soupsieve==2.3.2.post1",
    "starfile==0.5.2",
    "tblib==1.7.0",
    "threadpoolctl==3.1.0",
    "tifffile==2023.2.3",
    "toolz==0.12.0",
    "tornado==6.2",
    "tqdm==4.64.0",
    "types-pytz==2022.7.1.2",
    "types-tabulate==0.9.0.1",
    "typing_extensions",
    "umap-learn",
    "urllib3==1.26.14",
    "virtualenv==20.20.0",
    "w3lib==2.1.1",
    "websockets==10.4",
    "zict==2.2.0",
    "zipp==3.12.1",
